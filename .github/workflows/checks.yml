name: Tests and security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOCK_MODELS: "1"
      DEMO_MODE: "1"
      MODEL_API_KEY: ""
      SPORTRADAR_API_KEY: ""
      BALLDONTLIE_API_KEY: ""
      SCHEDULER_ENABLED: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install video tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.lock.txt pip-audit==2.10.1
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Backend tests (offline model fixtures)
        run: python -m pytest -q
      - name: Frontend tests and production build
        run: |
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Audit dependency locks
        run: |
          python -m pip_audit -r backend/requirements.lock.txt --no-deps --disable-pip
          npm --prefix frontend audit --audit-level=low
      - name: Scan full Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl --fail --silent --show-error --location --proto '=https' \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check --status
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          /tmp/gitleaks git . --log-opts=--all --redact=100 --no-banner
